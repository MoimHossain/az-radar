goe UI" font-size="18" font-weight="400" fill="#605E5C"><tspan x="70" dy="0">End-to-end message flow · persistence and observable state at every boundary</tspan></text><rect x="55" y="140" width="170" height="64" rx="18" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" filter="url(#shadow)"/><text x="140" y="180" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#242424"><tspan x="140" dy="0">Azure</tspan></text><line x1="140" y1="204" x2="140" y2="970" stroke="#0078D4" stroke-width="2" stroke-dasharray="7 8" opacity=".45"/><rect x="275" y="140" width="170" height="64" rx="18" fill="#FFFFFF" stroke="#5C2D91" stroke-width="2.5" filter="url(#shadow)"/><text x="360" y="180" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#242424"><tspan x="360" dy="0">Event Hubs</tspan></text><line x1="360" y1="204" x2="360" y2="970" stroke="#5C2D91" stroke-width="2" stroke-dasharray="7 8" opacity=".45"/><rect x="495" y="140" width="170" height="64" rx="18" fill="#FFFFFF" stroke="#107C10" stroke-width="2.5" filter="url(#shadow)"/><text x="580" y="180" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#242424"><tspan x="580" dy="0">Ingress</tspan></text><line x1="580" y1="204" x2="580" y2="970" stroke="#107C10" stroke-width="2" stroke-dasharray="7 8" opacity=".45"/><rect x="715" y="140" width="170" height="64" rx="18" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" filter="url(#shadow)"/><text x="800" y="180" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#242424"><tspan x="800" dy="0">Cosmos DB</tspan></text><line x1="800" y1="204" x2="800" y2="970" stroke="#0078D4" stroke-width="2" stroke-dasharray="7 8" opacity=".45"/><rect x="935" y="140" width="170" height="64" rx="18" fill="#FFFFFF" stroke="#CA5010" stroke-width="2.5" filter="url(#shadow)"/><text x="1020" y="180" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#242424"><tspan x="1020" dy="0">Service Bus</tspan></text><line x1="1020" y1="204" x2="1020" y2="970" stroke="#CA5010" stroke-width="2" stroke-dasharray="7 8" opacity=".45"/><rect x="1155" y="140" width="170" height="64" rx="18" fill="#FFFFFF" stroke="#107C10" stroke-width="2.5" filter="url(#shadow)"/><text x="1240" y="180" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#242424"><tspan x="1240" dy="0">Dispatcher</tspan></text><line x1="1240" y1="204" x2="1240" y2="970" stroke="#107C10" stroke-width="2" stroke-dasharray="7 8" opacity=".45"/><rect x="1375" y="140" width="170" height="64" rx="18" fill="#FFFFFF" stroke="#5C2D91" stroke-width="2.5" filter="url(#shadow)"/><text x="1460" y="180" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#242424"><tspan x="1460" dy="0">Teams</tspan></text><line x1="1460" y1="204" x2="1460" y2="970" stroke="#5C2D91" stroke-width="2" stroke-dasharray="7 8" opacity=".45"/><line x1="140" y1="255" x2="360" y2="255" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow-0078D4)"/><circle cx="118" cy="255" r="19" fill="#0078D4"/><text x="118" y="261" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="118" dy="0">1</tspan></text><rect x="118.0" y="273" width="265" height="68" rx="14" fill="#FFFFFF" stroke="#D1D1D1" filter="url(#shadow)"/><text x="250.0" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="550" fill="#242424"><tspan x="250.0" dy="0">Azure writes a subscription-specific</tspan><tspan x="250.0" dy="17">ServiceHealth Activity Log record</tspan></text><line x1="360" y1="375" x2="580" y2="375" stroke="#5C2D91" stroke-width="4" marker-end="url(#arrow-5C2D91)"/><circle cx="338" cy="375" r="19" fill="#5C2D91"/><text x="338" y="381" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="338" dy="0">2</tspan></text><rect x="338.0" y="393" width="265" height="68" rx="14" fill="#FFFFFF" stroke="#D1D1D1" filter="url(#shadow)"/><text x="470.0" y="420" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="550" fill="#242424"><tspan x="470.0" dy="0">Diagnostic setting streams the event;</tspan><tspan x="470.0" dy="17">Event Hubs retains it for replay</tspan></text><line x1="580" y1="495" x2="800" y2="495" stroke="#107C10" stroke-width="4" marker-end="url(#arrow-107C10)"/><circle cx="558" cy="495" r="19" fill="#107C10"/><text x="558" y="501" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="558" dy="0">3</tspan></text><rect x="558.0" y="513" width="265" height="68" rx="14" fill="#FFFFFF" stroke="#D1D1D1" filter="url(#shadow)"/><text x="690.0" y="540" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="550" fill="#242424"><tspan x="690.0" dy="0">Ingress validates, normalizes and enriches;</tspan><tspan x="690.0" dy="17">Cosmos rejects duplicate versions</tspan></text><line x1="800" y1="615" x2="1020" y2="615" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow-0078D4)"/><circle cx="778" cy="615" r="19" fill="#0078D4"/><text x="778" y="621" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="778" dy="0">4</tspan></text><rect x="778.0" y="633" width="265" height="68" rx="14" fill="#FFFFFF" stroke="#D1D1D1" filter="url(#shadow)"/><text x="910.0" y="660" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="550" fill="#242424"><tspan x="910.0" dy="0">Event and one intent per matching route</tspan><tspan x="910.0" dy="17">are durable before external delivery</tspan></text><line x1="1020" y1="735" x2="1240" y2="735" stroke="#CA5010" stroke-width="4" marker-end="url(#arrow-CA5010)"/><circle cx="998" cy="735" r="19" fill="#CA5010"/><text x="998" y="741" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="998" dy="0">5</tspan></text><rect x="998.0" y="753" width="265" height="68" rx="14" fill="#FFFFFF" stroke="#D1D1D1" filter="url(#shadow)"/><text x="1130.0" y="780" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="550" fill="#242424"><tspan x="1130.0" dy="0">Service Bus separates delivery work;</tspan><tspan x="1130.0" dy="17">dispatcher claims one stable intent</tspan></text><line x1="1240" y1="855" x2="1460" y2="855" stroke="#5C2D91" stroke-width="4" marker-end="url(#arrow-5C2D91)"/><circle cx="1218" cy="855" r="19" fill="#5C2D91"/><text x="1218" y="861" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="1218" dy="0">6</tspan></text><rect x="1218.0" y="873" width="265" height="68" rx="14" fill="#FFFFFF" stroke="#D1D1D1" filter="url(#shadow)"/><text x="1350.0" y="900" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="550" fill="#242424"><tspan x="1350.0" dy="0">Bot creates a new channel conversation;</tspan><tspan x="1350.0" dy="17">Teams returns an activity ID</tspan></text><line x1="1460" y1="965" x2="800" y2="965" stroke="#107C10" stroke-width="4" marker-end="url(#arrow-107C10)"/><circle cx="1330" cy="965" r="19" fill="#107C10"/><text x="1330" y="971" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="1330" dy="0">7</tspan></text><rect x="920" y="931" width="350" height="68" rx="14" fill="#FFFFFF" stroke="#107C10" filter="url(#shadow)"/><text x="1095" y="958" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="600" fill="#242424"><tspan x="1095" dy="0">Persist Teams activity ID and mark</tspan></text><text x="1095" y="976" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="600" fill="#242424"><tspan x="1095" dy="0">the intent delivered</tspan></text><rect x="70" y="1010" width="1460" height="56" rx="18" fill="#FDEBEC" stroke="#D13438" stroke-width="1.5"/><text x="100" y="1044" text-anchor="start" font-family="Segoe UI" font-size="15" font-weight="700" fill="#D13438"><tspan x="100" dy="0">Failure path</tspan></text><text x="230" y="1044" text-anchor="start" font-family="Segoe UI" font-size="14" font-weight="500" fill="#242424"><tspan x="230" dy="0">Transient Teams or network failure → retry-scheduled</tspan></text><text x="690" y="1044" text-anchor="start" font-family="Segoe UI" font-size="14" font-weight="500" fill="#242424"><tspan x="690" dy="0">Permanent destination failure or exhausted retries → dead-lettered</tspan></text><text x="1250" y="1044" text-anchor="start" font-family="Segoe UI" font-size="14" font-weight="600" fill="#107C10"><tspan x="1250" dy="0">Other channels continue</tspan></text><rect x="70" y="120" width="1460" height="900" rx="28" fill="none" stroke="#D1D1D1" stroke-width="1"/></svg>