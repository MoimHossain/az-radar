<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CloudLens signal to action architecture</title>
  <desc id="desc">Azure Updates, Microsoft Learn, GitHub, and Azure Service Health flow through the CloudLens intelligence core to a dashboard, Microsoft Teams, and Azure DevOps Wiki, supported by private Azure services and managed identity.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162f"/>
      <stop offset="0.5" stop-color="#102a50"/>
      <stop offset="1" stop-color="#091b33"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="0.52" stop-color="#5c2d91"/>
      <stop offset="1" stop-color="#00b7c3"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12375f"/>
      <stop offset="1" stop-color="#153d55"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163f73"/>
      <stop offset="1" stop-color="#0c2b50"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#442466"/>
      <stop offset="1" stop-color="#26183f"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075f68"/>
      <stop offset="1" stop-color="#073842"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity="0.48"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#59b5ff"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5de5d5"/>
    </marker>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#86a9cf" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="26" fill="url(#background)"/>
  <rect width="1600" height="900" rx="26" fill="url(#grid)"/>
  <circle cx="790" cy="378" r="310" fill="#0078d4" opacity="0.05"/>
  <circle cx="790" cy="378" r="240" fill="#5c2d91" opacity="0.05"/>

  <text x="74" y="74" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">From Azure signal to informed action</text>
  <text x="75" y="109" fill="#a9c8e8" font-family="Segoe UI, Arial, sans-serif" font-size="18">CloudLens unifies lifecycle intelligence, candidate resource impact, and governed operational delivery.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="70" y="174" fill="#75c5ff" font-size="16" font-weight="700" letter-spacing="2">SIGNALS</text>
    <text x="1302" y="174" fill="#67e8d5" font-size="16" font-weight="700" letter-spacing="2">ACTION</text>

    <!-- Signal cards -->
    <g filter="url(#shadow)">
      <rect x="68" y="202" width="310" height="108" rx="18" fill="url(#blueCard)" stroke="#3097e6" stroke-width="1.5"/>
      <circle cx="116" cy="256" r="27" fill="#0078d4"/>
      <path d="M104 257h24M116 245v24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="157" y="245" fill="#fff" font-size="21" font-weight="700">Azure Updates</text>
      <text x="157" y="274" fill="#b9d8f4" font-size="15">Catalog + RSS + revisions</text>

      <rect x="68" y="329" width="310" height="108" rx="18" fill="url(#blueCard)" stroke="#3097e6" stroke-width="1.5"/>
      <circle cx="116" cy="383" r="27" fill="#2583c5"/>
      <path d="M103 370h26v25h-26zM108 376h16M108 382h16M108 388h11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="157" y="372" fill="#fff" font-size="21" font-weight="700">Microsoft Learn</text>
      <text x="157" y="401" fill="#b9d8f4" font-size="15">Watched documentation</text>

      <rect x="68" y="456" width="310" height="108" rx="18" fill="url(#purpleCard)" stroke="#9b62cc" stroke-width="1.5"/>
      <circle cx="116" cy="510" r="27" fill="#5c2d91"/>
      <path d="M103 511c0-9 6-16 13-16s13 7 13 16c0 7-4 12-9 15v-8c3-1 5-4 5-8 0-6-4-10-9-10s-9 4-9 10c0 4 2 7 5 8v8c-5-3-9-8-9-15z" fill="#fff"/>
      <text x="157" y="499" fill="#fff" font-size="21" font-weight="700">GitHub Change Radar</text>
      <text x="157" y="528" fill="#dac7ec" font-size="15">Selected docs + diffs</text>

      <rect x="68" y="583" width="310" height="108" rx="18" fill="url(#tealCard)" stroke="#20b7b0" stroke-width="1.5"/>
      <circle cx="116" cy="637" r="27" fill="#008b95"/>
      <path d="M116 619l17 8v11c0 12-8 19-17 23-9-4-17-11-17-23v-11z" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M108 638l6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="157" y="626" fill="#fff" font-size="21" font-weight="700">Azure Service Health</text>
      <text x="157" y="655" fill="#b9ece9" font-size="15">Incidents + maintenance</text>
    </g>

    <!-- Input flow -->
    <path d="M378 256 C450 256 454 326 518 326" fill="none" stroke="#59b5ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M378 383 C451 383 456 365 518 365" fill="none" stroke="#59b5ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M378 510 C451 510 456 404 518 404" fill="none" stroke="#aa76d7" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M378 637 C458 637 461 444 518 444" fill="none" stroke="#45d0c4" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <!-- Core -->
    <g filter="url(#shadow)">
      <rect x="520" y="176" width="560" height="544" rx="34" fill="#081c34" stroke="url(#core)" stroke-width="4"/>
      <rect x="543" y="199" width="514" height="72" rx="22" fill="url(#core)"/>
      <circle cx="585" cy="235" r="23" fill="#ffffff" opacity="0.18"/>
      <circle cx="585" cy="235" r="12" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M601 251l12 12" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="628" y="228" fill="#fff" font-size="27" font-weight="700">CloudLens Intelligence Core</text>
      <text x="628" y="251" fill="#e6f2ff" font-size="14">Traceable evidence. Consistent triage. Human decisions.</text>

      <rect x="554" y="301" width="224" height="126" rx="20" fill="#112e51" stroke="#2589d8" stroke-width="1.5"/>
      <text x="578" y="332" fill="#72c6ff" font-size="13" font-weight="700" letter-spacing="1.4">01 / NORMALIZE</text>
      <text x="578" y="365" fill="#fff" font-size="21" font-weight="700">Ingest + deduplicate</text>
      <text x="578" y="391" fill="#b7cee5" font-size="14">Retain source facts, revisions,</text>
      <text x="578" y="411" fill="#b7cee5" font-size="14">history, and diagnostics.</text>

      <rect x="802" y="301" width="224" height="126" rx="20" fill="#30204b" stroke="#9563c7" stroke-width="1.5"/>
      <text x="826" y="332" fill="#c59be7" font-size="13" font-weight="700" letter-spacing="1.4">02 / INTERPRET</text>
      <text x="826" y="365" fill="#fff" font-size="21" font-weight="700">AI-assisted brief</text>
      <text x="826" y="391" fill="#d9cce6" font-size="14">Severity, scope, deadline,</text>
      <text x="826" y="411" fill="#d9cce6" font-size="14">action, effort, migration.</text>

      <rect x="554" y="451" width="224" height="126" rx="20" fill="#183b4a" stroke="#21a4ad" stroke-width="1.5"/>
      <text x="578" y="482" fill="#77dbe0" font-size="13" font-weight="700" letter-spacing="1.4">03 / PLAN</text>
      <text x="578" y="515" fill="#fff" font-size="21" font-weight="700">Lifecycle calendar</text>
      <text x="578" y="541" fill="#c1dfe1" font-size="14">Put dated changes into one</text>
      <text x="578" y="561" fill="#c1dfe1" font-size="14">prioritization view.</text>

      <rect x="802" y="451" width="224" height="126" rx="20" fill="#173f32" stroke="#34a66f" stroke-width="1.5"/>
      <text x="826" y="482" fill="#82ddae" font-size="13" font-weight="700" letter-spacing="1.4">04 / CORRELATE</text>
      <text x="826" y="515" fill="#fff" font-size="21" font-weight="700">Candidate impact</text>
      <text x="826" y="541" fill="#c5e5d3" font-size="14">Use Resource Graph to find</text>
      <text x="826" y="561" fill="#c5e5d3" font-size="14">resources worth investigating.</text>

      <path d="M778 364h24" stroke="#7fbce8" stroke-width="3" marker-end="url(#arrowBlue)"/>
      <path d="M666 427v24" stroke="#5de5d5" stroke-width="3" marker-end="url(#arrowTeal)"/>
      <path d="M914 427v24" stroke="#5de5d5" stroke-width="3" marker-end="url(#arrowTeal)"/>

      <rect x="554" y="607" width="472" height="78" rx="19" fill="#0f2943" stroke="#456f97" stroke-width="1.5"/>
      <text x="580" y="638" fill="#fff" font-size="18" font-weight="700">Durable orchestration + inspectable delivery</text>
      <text x="580" y="665" fill="#abc7df" font-size="14">Jobs · event history · routing intent · retries · outcomes · audit evidence</text>
    </g>

    <!-- Output flow -->
    <path d="M1080 326 C1140 326 1145 256 1210 256" fill="none" stroke="#5de5d5" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M1080 383 C1140 383 1145 383 1210 383" fill="none" stroke="#5de5d5" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M1080 444 C1140 444 1145 510 1210 510" fill="none" stroke="#5de5d5" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M1080 510 C1140 510 1145 637 1210 637" fill="none" stroke="#5de5d5" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <!-- Output cards -->
    <g filter="url(#shadow)">
      <rect x="1210" y="202" width="322" height="108" rx="18" fill="url(#tealCard)" stroke="#20b7b0" stroke-width="1.5"/>
      <circle cx="1260" cy="256" r="27" fill="#008b95"/>
      <path d="M1247 269v-12h8v12zM1257 269v-22h8v22zM1267 269v-31h8v31z" fill="#fff"/>
      <text x="1301" y="245" fill="#fff" font-size="21" font-weight="700">Operating dashboard</text>
      <text x="1301" y="274" fill="#b9ece9" font-size="15">Evidence + planning views</text>

      <rect x="1210" y="329" width="322" height="108" rx="18" fill="url(#tealCard)" stroke="#20b7b0" stroke-width="1.5"/>
      <circle cx="1260" cy="383" r="27" fill="#6264a7"/>
      <text x="1247" y="392" fill="#fff" font-size="26" font-weight="700">T</text>
      <text x="1301" y="372" fill="#fff" font-size="21" font-weight="700">CloudLens in Teams</text>
      <text x="1301" y="401" fill="#d4d5f0" font-size="15">Owned operational channels</text>

      <rect x="1210" y="456" width="322" height="108" rx="18" fill="url(#blueCard)" stroke="#3097e6" stroke-width="1.5"/>
      <circle cx="1260" cy="510" r="27" fill="#0078d4"/>
      <path d="M1247 497h26v26h-26zM1253 503h14M1253 509h14M1253 515h9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="1301" y="499" fill="#fff" font-size="21" font-weight="700">Azure DevOps Wiki</text>
      <text x="1301" y="528" fill="#b9d8f4" font-size="15">One published knowledge hub</text>

      <rect x="1210" y="583" width="322" height="108" rx="18" fill="url(#purpleCard)" stroke="#9b62cc" stroke-width="1.5"/>
      <circle cx="1260" cy="637" r="27" fill="#5c2d91"/>
      <path d="M1246 637h28M1260 623v28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="1301" y="626" fill="#fff" font-size="21" font-weight="700">Engineering decision</text>
      <text x="1301" y="655" fill="#dac7ec" font-size="15">Review · prioritize · respond</text>
    </g>

    <!-- Azure foundation -->
    <g filter="url(#shadow)">
      <rect x="68" y="756" width="1464" height="96" rx="23" fill="url(#azure)" stroke="#346c9e" stroke-width="1.5"/>
      <text x="96" y="786" fill="#7fc8ff" font-size="13" font-weight="700" letter-spacing="1.6">PRIVATE AZURE FOUNDATION</text>
      <text x="96" y="821" fill="#fff" font-size="18" font-weight="700">App Service</text>
      <text x="255" y="821" fill="#fff" font-size="18" font-weight="700">Cosmos DB</text>
      <text x="416" y="821" fill="#fff" font-size="18" font-weight="700">Azure OpenAI</text>
      <text x="601" y="821" fill="#fff" font-size="18" font-weight="700">Resource Graph</text>
      <text x="802" y="821" fill="#fff" font-size="18" font-weight="700">Event Hubs</text>
      <text x="951" y="821" fill="#fff" font-size="18" font-weight="700">Service Bus</text>
      <text x="1098" y="821" fill="#fff" font-size="18" font-weight="700">Private ACR</text>
      <text x="1260" y="821" fill="#fff" font-size="18" font-weight="700">Managed Identity</text>
      <circle cx="78" cy="817" r="5" fill="#5de5d5" filter="url(#glow)"/>
      <text x="1409" y="786" fill="#82ddae" font-size="13" font-weight="700">ZERO KEYS</text>
    </g>

    <path d="M790 720v36" stroke="#5de5d5" stroke-width="3" stroke-dasharray="8 8"/>
  </g>
</svg>
